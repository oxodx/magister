name: Commit release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build commit APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager --install 'platforms;android-33' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Cache Gradle and native downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/downloads
          key: release-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'CMakeLists.txt') }}
          restore-keys: |
            release-${{ runner.os }}-

      - name: Read build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_code=$((1000000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.0+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ steps.meta.outputs.version_code }} -PversionName=${{ steps.meta.outputs.version_name }}

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.meta.outputs.version_code }} -PversionName=${{ steps.meta.outputs.version_name }}

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            apk=app/build/outputs/apk/release/app-release.apk
          else
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$apk" "dist/magister-${{ steps.meta.outputs.sha }}.apk"

      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ steps.meta.outputs.version_code }}" dist/*.apk \
            --title "Build ${{ steps.meta.outputs.sha }}" \
            --notes "Automated build of commit ${{ github.sha }}. Signed with the repository release key when configured; otherwise this is a debug build. Signed builds are also published at https://oxodx.github.io/magister/fdroid/repo for F-Droid clients." \
            --target "$GITHUB_SHA"

      - name: Install F-Droid repository tools
        if: steps.signing.outputs.signed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-tools"
          "$RUNNER_TEMP/fdroid-tools/bin/pip" install --disable-pip-version-check fdroidserver==2.4.5
          echo "FDROID=$RUNNER_TEMP/fdroid-tools/bin/fdroid" >> "$GITHUB_ENV"

      - name: Build signed F-Droid repository
        if: steps.signing.outputs.signed == 'true'
        env:
          FDROID_REPO_KEYSTORE: ${{ runner.temp }}/release.keystore
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FDROID_REPO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p fdroid/repo _site/fdroid
          cp dist/*.apk "fdroid/repo/org.magister.nativeapp_${{ steps.meta.outputs.version_code }}.apk"
          cd fdroid
          "$FDROID" update --pretty
          cd ..
          cp -a fdroid/repo _site/fdroid/repo
          cp fdroid/index.html _site/index.html

      - name: Configure GitHub Pages
        if: steps.signing.outputs.signed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload F-Droid repository
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy F-Droid repository
        if: steps.signing.outputs.signed == 'true'
        id: pages
        uses: actions/deploy-pages@v5
