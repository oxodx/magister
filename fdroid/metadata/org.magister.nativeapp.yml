Name: Magister Native
Summary: Native Android client for Magister school accounts
Description: |-
  A lightweight native Android client for viewing a Magister schedule, grades,
  assignments, attendance, messages and digital textbooks. Authentication uses
  Magister's official web login and supports school two-factor authentication.

  This app requires an account with a school that uses Magister.

