plugins { id 'com.android.application' }

def buildVersionCode = project.findProperty('versionCode')
def buildVersionName = project.findProperty('versionName')
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_PATH')

android {
  namespace 'org.magister.nativeapp'
  compileSdk 33
  ndkVersion '28.2.13676358'

  def ndkHome = System.getenv('ANDROID_NDK_HOME')
  def legacyNdk = file('/home/oxod/.buildozer/android/platform/android-ndk-r28c')
  if (ndkHome) {
    ndkPath(ndkHome)
  } else if (legacyNdk.exists()) {
    ndkPath(legacyNdk.absolutePath)
  }

  defaultConfig {
    applicationId 'org.magister.nativeapp'
    minSdk 24
    targetSdk 33
    versionCode(buildVersionCode ? buildVersionCode.toInteger() : 1)
    versionName(buildVersionName ?: '1.0.0')
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  }

  signingConfigs {
    if (releaseKeystore) {
      release {
        storeFile file(releaseKeystore)
        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        keyAlias System.getenv('ANDROID_KEY_ALIAS')
        keyPassword System.getenv('ANDROID_KEY_PASSWORD')
      }
    }
  }

  externalNativeBuild { cmake { path file('../CMakeLists.txt'); version '3.22.1' } }
  buildTypes {
    release {
      minifyEnabled false
      if (releaseKeystore) signingConfig(signingConfigs.release)
    }
  }
}
