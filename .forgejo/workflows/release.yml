name: Commit release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build commit APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up JDK 17
        uses: https://data.forgejo.org/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install release tooling
        run: |
          apt-get update
          apt-get install --yes jq

      - name: Set up Android SDK
        run: |
          android_home="$RUNNER_TEMP/android-sdk"
          mkdir -p "$android_home/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$android_home/cmdline-tools"
          mv "$android_home/cmdline-tools/cmdline-tools" "$android_home/cmdline-tools/latest"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$android_home" "$android_home" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$android_home/cmdline-tools/latest/bin" "$android_home/platform-tools" >> "$GITHUB_PATH"
          yes | "$android_home/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$android_home/cmdline-tools/latest/bin/sdkmanager" --install \
                'platform-tools' 'platforms;android-33' 'build-tools;35.0.0' \
                'ndk;28.2.13676358' 'cmake;3.22.1'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Cache Gradle and native downloads
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/downloads
          key: release-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'CMakeLists.txt') }}
          restore-keys: |
            release-${{ runner.os }}-

      - name: Read build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.0+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ steps.meta.outputs.version_code }} -PversionName=${{ steps.meta.outputs.version_name }}

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.meta.outputs.version_code }} -PversionName=${{ steps.meta.outputs.version_name }}

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            apk=app/build/outputs/apk/release/app-release.apk
          else
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$apk" "dist/magister-${{ steps.meta.outputs.sha }}.apk"

      - name: Publish commit release
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ steps.meta.outputs.version_code }}"
          title="Build ${{ steps.meta.outputs.sha }}"
          notes="Automated build of commit $GITHUB_SHA. Signed builds are also published at https://fdroid.oxod.nl for F-Droid clients."
          release_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          if ! release=$(curl --fail --silent --show-error \
              --header "Authorization: token $RELEASE_TOKEN" "$release_url"); then
            release=$(jq -n \
              --arg tag "$tag" --arg target "$GITHUB_SHA" \
              --arg title "$title" --arg notes "$notes" \
              '{tag_name: $tag, target_commitish: $target, name: $title, body: $notes}' \
              | curl --fail-with-body --show-error \
                  --request POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
                  --header "Authorization: token $RELEASE_TOKEN" \
                  --header 'Content-Type: application/json' \
                  --data-binary @-)
          fi
          release_id=$(printf '%s' "$release" | jq -er '.id')
          for apk in dist/*.apk; do
            curl --fail --silent --show-error \
              --request POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --header "Authorization: token $RELEASE_TOKEN" \
              --form "attachment=@$apk"
          done

      - name: Publish to shared F-Droid repository
        if: steps.signing.outputs.signed == 'true'
        env:
          FDROID_DEPLOY_KEY: ${{ secrets.FDROID_DEPLOY_KEY }}
        run: |
          if [ -z "$FDROID_DEPLOY_KEY" ]; then
            echo 'Shared F-Droid publishing is not configured; skipping.'
            exit 0
          fi
          repository="$RUNNER_TEMP/fdroid"
          deploy_key="$RUNNER_TEMP/fdroid-deploy-key"
          printf '%s\n' "$FDROID_DEPLOY_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"
          export GIT_SSH_COMMAND="ssh -i $deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@git.oxod.nl:oxod/fdroid.git "$repository"
          mkdir -p "$repository/releases"
          jq -n \
            --arg url "$GITHUB_SERVER_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "build-${{ steps.meta.outputs.version_code }}" \
            --arg asset "magister-${{ steps.meta.outputs.sha }}.apk" \
            '{url: $url, repository: $repository, tag: $tag, asset: $asset}' \
            > "$repository/releases/nl.oxod.magister.json"
          cd "$repository"
          git config user.name 'Magister release bot'
          git config user.email 'forgejo-actions@oxod.nl'
          git add releases/nl.oxod.magister.json
          git commit -m "Publish Magister ${{ steps.meta.outputs.version_code }}"
          git push origin main
